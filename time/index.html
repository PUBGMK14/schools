<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학성고등학교 시간표</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c0392b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="시간표" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --accent: #c0392b;
      --accent-light: #e74c3c;
      --accent-muted: #fdecea;
      --text: #1a1209;
      --text-sub: #6b5b45;
      --text-muted: #a89070;
      --border: #ede3d5;
      --shadow: 0 2px 16px rgba(60,30,10,0.07);
      --shadow-card: 0 4px 32px rgba(60,30,10,0.10);
      --today-border: #c0392b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--accent);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(192,57,43,0.18);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px 14px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }
    .logo-ko {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 1.55rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .logo-sub {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.75);
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .header-badge {
      margin-left: auto;
      background: rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── WEEK NAV ── */
    .week-nav {
      max-width: 1100px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .week-label {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      text-align: center;
    }
    .nav-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--accent);
      font-size: 1.1rem;
      transition: all 0.18s;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .today-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: opacity 0.18s;
      flex-shrink: 0;
    }
    .today-btn:hover { opacity: 0.85; }

    /* ── CLASS INFO STRIP ── */
    .class-info {
      max-width: 1100px;
      margin: 16px auto 0;
      padding: 0 24px;
    }
    .class-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.78rem;
      color: var(--text-sub);
    }
    .class-badge b { color: var(--accent); font-weight: 700; }

    /* ── DESKTOP GRID ── */
    .week-grid {
      max-width: 1100px;
      margin: 20px auto 0;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    @media (max-width: 1024px) and (min-width: 768px) {
      .week-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ── DAY CARD (shared) ── */
    .day-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.18s, box-shadow 0.18s;
      display: flex;
      flex-direction: column;
    }
    .day-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-card); }
    .day-card.today {
      border-color: var(--today-border);
      box-shadow: 0 0 0 2px var(--accent-muted), var(--shadow-card);
    }
    .day-header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .day-card.today .day-header { background: var(--accent); }
    .day-name {
      font-family: 'Nanum Myeongjo', serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .day-card.today .day-name { color: #fff; }
    .day-date { font-size: 0.75rem; color: var(--text-muted); }
    .day-card.today .day-date { color: rgba(255,255,255,0.8); }
    .today-badge {
      background: rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.68rem;
      font-weight: 500;
    }
    .day-body { padding: 14px; flex: 1; }

    .period-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.4;
    }
    .period-item:last-child { border-bottom: none; }
    .period-num {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent-muted);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .period-subj { flex: 1; font-weight: 500; }
    .period-item.empty .period-subj { color: var(--text-muted); }
    .period-item.overridden { background: #fff8e6; margin: 0 -14px; padding: 6px 14px; }
    .override-tag {
      font-size: 0.62rem;
      color: #b8860b;
      background: #fff2c9;
      border-radius: 4px;
      padding: 1px 5px;
      font-weight: 700;
      margin-left: 4px;
    }

    .meal-info {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .info-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-sub); }
    .info-label { font-weight: 500; color: var(--accent); min-width: 48px; }

    .no-meal { text-align: center; padding: 24px 0; color: var(--text-muted); font-size: 0.85rem; }
    .no-meal-icon { font-size: 2rem; margin-bottom: 8px; }

    /* ── LOADING ── */
    .state-box { max-width: 1100px; margin: 40px auto; padding: 0 24px; text-align: center; color: var(--text-muted); }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ── */
    footer { background: var(--text); color: rgba(255,255,255,0.5); text-align: center; font-size: 0.78rem; padding: 20px; }
    footer a { color: rgba(255,255,255,0.7); text-decoration: none; }

    /* ════════════════════════════════════════
       MOBILE CAROUSEL  (≤ 767px)
    ════════════════════════════════════════ */
    .mobile-carousel { display: none; }

    @media (max-width: 767px) {
      /* hide desktop grid */
      #main-content .week-grid { display: none !important; }

      /* header */
      .header-inner { flex-wrap: wrap; padding: 14px 16px 12px; }
      .logo-ko { font-size: 1.25rem; }
      .header-badge { font-size: 0.72rem; padding: 4px 10px; }
      .week-nav { padding: 0 16px; margin-top: 20px; }
      .week-label { font-size: 1rem; }
      .class-info { padding: 0 16px; }

      /* show carousel */
      .mobile-carousel { display: block; padding-bottom: 60px; }

      /* day tab strip */
      .day-tabs {
        display: flex;
        padding: 12px 16px 0;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .day-tabs::-webkit-scrollbar { display: none; }
      .day-tab {
        flex: 1;
        min-width: 52px;
        background: var(--card);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        padding: 8px 4px;
        text-align: center;
        cursor: pointer;
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 0.75rem;
        color: var(--text-sub);
        transition: all 0.18s;
        line-height: 1.4;
      }
      .day-tab .tab-day  { font-weight: 700; display: block; }
      .day-tab .tab-date { font-size: 0.65rem; color: var(--text-muted); display: block; }
      .day-tab.active    { background: var(--accent); border-color: var(--accent); color: #fff; }
      .day-tab.active .tab-date { color: rgba(255,255,255,0.8); }

      /* slider */
      .carousel-track-wrap { overflow: hidden; width: 100%; margin-top: 12px; }
      .carousel-track {
        display: flex;
        transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
        will-change: transform;
      }
      .carousel-slide { flex: 0 0 100%; width: 100%; padding: 0 16px; }

      /* prev / next */
      .carousel-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px 0;
        gap: 10px;
      }
      .carousel-nav-btn {
        background: var(--card);
        border: 1.5px solid var(--border);
        border-radius: 999px;
        padding: 10px 0;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--accent);
        cursor: pointer;
        font-family: 'Noto Sans KR', sans-serif;
        transition: all 0.18s;
        flex: 1;
        text-align: center;
      }
      .carousel-nav-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
      .carousel-nav-btn:disabled { opacity: 0.3; pointer-events: none; }
      .carousel-counter { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="logo-sub">학성고등학교</div>
      <div class="logo-ko">📘 시간표</div>
    </div>
    <div class="header-badge" id="today-display"></div>
  </div>
</header>

<div class="week-nav">
  <button class="nav-btn" id="prev-btn">&#8592;</button>
  <div class="week-label" id="week-label"></div>
  <button class="nav-btn" id="next-btn">&#8594;</button>
  <button class="today-btn" id="today-btn">오늘</button>
</div>

<div class="class-info">
  <span class="class-badge"><b>3학년 9반</b> · <span id="term-display"></span></span>
</div>

<!-- 데스크탑 / 태블릿 그리드 -->
<div id="main-content">
  <div class="state-box">
    <div class="spinner"></div>
    <div>시간표를 불러오는 중...</div>
  </div>
</div>

<!-- 모바일 캐러셀 -->
<div class="mobile-carousel" id="mobile-carousel"></div>

<footer>
  <div>데이터 출처: <a href="https://open.neis.go.kr" target="_blank">NEIS 교육정보 개방 포털</a> · 학성고등학교 시간표</div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEFHdRAEh7HoDoq4_O_RVyuNQceSAEaQg",
    authDomain: "pubginfo-time.firebaseapp.com",
    databaseURL: "https://pubginfo-time-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "pubginfo-time",
    storageBucket: "pubginfo-time.firebasestorage.app",
    messagingSenderId: "897626485020",
    appId: "1:897626485020:web:246ac8e1a9071deb58cad9",
    measurementId: "G-8BRTF75VVS"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ─── CONFIG ──────────────────────────────────────
  const KEY   = 'ad7ef12adeb548f89194a4563ef8ede0';
  const OFCDC = 'H10';
  const SCHUL = '7480029';
  const GRADE = '3';
  const CLASS_NM = '9';
  const OVERRIDE_PATH = `overrides/${OFCDC}_${SCHUL}_${GRADE}_${CLASS_NM}`;
  // ─────────────────────────────────────────────────

  const DAY_KO = ['일','월','화','수','목','금','토'];
  const DOW_TO_ID = { 1:'mon', 2:'tue', 3:'wed', 4:'thu', 5:'fri' };

  let baseMonday   = getMonday(new Date());
  let carouselIdx  = 0;
  let touchStartX  = 0;
  let overrideData = {}; // { mon: {1: '국어', ...}, ... }

  // ── FIREBASE ──────────────────────────────────────
  async function loadOverrides() {
    try {
      const snap = await get(ref(db, OVERRIDE_PATH));
      overrideData = snap.exists() ? snap.val() : {};
    } catch (e) {
      overrideData = {};
      console.error('오버라이드 불러오기 실패', e);
    }
  }
  function getOverride(day, period) {
    const dayId = DOW_TO_ID[day.getDay()];
    return overrideData?.[dayId]?.[period];
  }

  // ── UTILS ─────────────────────────────────────────
  function getMonday(d) {
    const date = new Date(d);
    const day  = date.getDay();
    date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
    date.setHours(0,0,0,0);
    return date;
  }
  function toYMD(d) {
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmt(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
  function isToday(d) {
    const n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function getWeekDays(monday) {
    return Array.from({length:5}, (_,i) => {
      const d = new Date(monday); d.setDate(d.getDate()+i); return d;
    });
  }
  function getAY(d) { return d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear() - 1; }
  function getSem(d) {
    const m = d.getMonth() + 1;
    // 3~8월 = 1학기, 9월~다음해 2월 = 2학기
    // (여름방학이 8월 말까지 걸쳐있는 학교가 많아 8월은 학교 학사일정에 따라 다를 수 있음)
    return (m >= 3 && m <= 8) ? '1' : '2';
  }
  function fmtLoadDtm(s) {
    if (!s || s.length < 8) return '';
    return `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}`;
  }

  // ── HEADER ────────────────────────────────────────
  function updateTodayDisplay() {
    const n = new Date();
    document.getElementById('today-display').textContent =
      `${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${DAY_KO[n.getDay()]})`;
  }
  function updateWeekLabel(days) {
    const f=days[0], l=days[4];
    document.getElementById('week-label').textContent =
      `${f.getFullYear()}년 ${f.getMonth()+1}월 ${f.getDate()}일 — ${l.getMonth()+1}월 ${l.getDate()}일`;
  }
  function updateTermFromRows(rows) {
    const el = document.getElementById('term-display');
    if (rows && rows.length > 0) {
      el.textContent = `${rows[0].AY}학년도 ${rows[0].SEM}학기`;
    } else {
      el.textContent = '';
    }
  }

  // ── API ───────────────────────────────────────────
  async function fetchTimetable(from, to) {
    // AY/SEM을 명시하지 않으면 NEIS가 엉뚱한 학기 데이터를 섞어 줄 수 있어
    // 조회 기준일(주의 월요일)로 학기를 계산해 명시적으로 요청한다.
    const ay = getAY(baseMonday);
    const sem = getSem(baseMonday);
    const url = `https://open.neis.go.kr/hub/hisTimetable`
      + `?KEY=${KEY}&Type=json&pIndex=1&pSize=100`
      + `&ATPT_OFCDC_SC_CODE=${OFCDC}&SD_SCHUL_CODE=${SCHUL}`
      + `&AY=${ay}&SEM=${sem}&GRADE=${GRADE}&CLASS_NM=${CLASS_NM}`
      + `&TI_FROM_YMD=${from}&TI_TO_YMD=${to}`;
    const resp = await fetch(url);
    const data = await resp.json();
    return data.hisTimetable ? data.hisTimetable[1].row : [];
  }

  // ── BUILD CARD ────────────────────────────────────
  function buildCard(day, periods) {
    const today = isToday(day);
    const card  = document.createElement('div');
    card.className = 'day-card' + (today ? ' today' : '');

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `
      <div>
        <div class="day-name">${DAY_KO[day.getDay()]}요일</div>
        <div class="day-date">${fmt(day)}</div>
      </div>
      ${today ? '<span class="today-badge">오늘</span>' : ''}`;
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'day-body';

    if (!periods || periods.length === 0) {
      body.innerHTML = `<div class="no-meal"><div class="no-meal-icon">📭</div><div>시간표 정보 없음</div></div>`;
    } else {
      const sorted = [...periods].sort((a,b) => parseInt(a.PERIO) - parseInt(b.PERIO));
      let latestLoad = '';
      sorted.forEach(p => {
        const override = getOverride(day, p.PERIO);
        const hasOverride = override !== undefined && override !== '';
        const subj = hasOverride ? override : (p.ITRT_CNTNT || '-');

        const div = document.createElement('div');
        div.className = 'period-item' + (hasOverride ? ' overridden' : '');
        div.innerHTML = `
          <div class="period-num">${p.PERIO}</div>
          <div class="period-subj">${subj}${hasOverride ? ' <span class="override-tag">변경</span>' : ''}</div>`;
        body.appendChild(div);
        if (p.LOAD_DTM && p.LOAD_DTM > latestLoad) latestLoad = p.LOAD_DTM;
      });
      if (latestLoad) {
        const info = document.createElement('div');
        info.className = 'meal-info';
        info.innerHTML = `<div class="info-row"><span class="info-label">수정일자</span>${fmtLoadDtm(latestLoad)}</div>`;
        body.appendChild(info);
      }
    }
    card.appendChild(body);
    return card;
  }

  // ── MOBILE CAROUSEL ───────────────────────────────
  function buildCarousel(days, byDate) {
    const todayIdx = days.findIndex(d => isToday(d));
    carouselIdx    = todayIdx >= 0 ? todayIdx : 0;

    const wrap = document.getElementById('mobile-carousel');
    wrap.innerHTML = '';

    // ① 요일 탭
    const tabStrip = document.createElement('div');
    tabStrip.className = 'day-tabs';
    days.forEach((day, i) => {
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (i === carouselIdx ? ' active' : '');
      btn.innerHTML = `<span class="tab-day">${DAY_KO[day.getDay()]}</span><span class="tab-date">${fmt(day)}</span>`;
      btn.addEventListener('click', () => goTo(i));
      tabStrip.appendChild(btn);
    });
    wrap.appendChild(tabStrip);

    // ② 슬라이더 트랙
    const trackWrap = document.createElement('div');
    trackWrap.className = 'carousel-track-wrap';
    const track = document.createElement('div');
    track.className = 'carousel-track';
    track.id = 'c-track';

    days.forEach(day => {
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';
      slide.appendChild(buildCard(day, byDate[toYMD(day)] || []));
      track.appendChild(slide);
    });
    trackWrap.appendChild(track);

    // 스와이프 터치
    trackWrap.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
    trackWrap.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) goTo(carouselIdx + (dx < 0 ? 1 : -1));
    }, {passive:true});

    wrap.appendChild(trackWrap);

    // ③ 이전/다음 버튼
    const nav = document.createElement('div');
    nav.className = 'carousel-nav';
    nav.innerHTML = `
      <button class="carousel-nav-btn" id="c-prev">&#8592; 이전 날</button>
      <span class="carousel-counter" id="c-cnt"></span>
      <button class="carousel-nav-btn" id="c-next">다음 날 &#8594;</button>`;
    wrap.appendChild(nav);

    document.getElementById('c-prev').addEventListener('click', () => goTo(carouselIdx - 1));
    document.getElementById('c-next').addEventListener('click', () => goTo(carouselIdx + 1));

    applyPos(false);
  }

  function goTo(idx) {
    idx = Math.max(0, Math.min(4, idx));
    carouselIdx = idx;
    applyPos(true);
    document.querySelectorAll('.day-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
    const tabs = document.querySelectorAll('.day-tab');
    if (tabs[idx]) tabs[idx].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  }

  function applyPos(animate) {
    const track = document.getElementById('c-track');
    if (!track) return;
    track.style.transition = animate ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
    track.style.transform  = `translateX(-${carouselIdx * 100}%)`;
    const cnt  = document.getElementById('c-cnt');
    const prev = document.getElementById('c-prev');
    const next = document.getElementById('c-next');
    if (cnt)  cnt.textContent  = `${carouselIdx+1} / 5`;
    if (prev) prev.disabled    = carouselIdx === 0;
    if (next) next.disabled    = carouselIdx === 4;
  }

  // ── LOAD WEEK ─────────────────────────────────────
  async function loadWeek() {
    const days = getWeekDays(baseMonday);
    updateWeekLabel(days);

    const main = document.getElementById('main-content');
    const mob  = document.getElementById('mobile-carousel');
    const loadHTML = `<div class="state-box"><div class="spinner"></div><div>시간표를 불러오는 중...</div></div>`;
    main.innerHTML = loadHTML;
    mob.innerHTML  = loadHTML;

    let rows = [];
    try {
      await loadOverrides();
      rows = await fetchTimetable(toYMD(days[0]), toYMD(days[4]));
    } catch(e) {
      const err = `<div class="state-box">⚠️ 정보를 불러오지 못했습니다.</div>`;
      main.innerHTML = err; mob.innerHTML = err; return;
    }

    updateTermFromRows(rows);

    const byDate = {};
    rows.forEach(r => {
      const d = r.ALL_TI_YMD;
      if (!byDate[d]) byDate[d] = {};
      // 같은 교시가 중복으로 내려오는 경우 LOAD_DTM이 더 최신인 값을 사용
      const existing = byDate[d][r.PERIO];
      if (!existing || (r.LOAD_DTM || '') >= (existing.LOAD_DTM || '')) {
        byDate[d][r.PERIO] = r;
      }
    });
    // buildCard가 기대하는 배열 형태로 변환
    Object.keys(byDate).forEach(d => {
      byDate[d] = Object.values(byDate[d]);
    });

    // 데스크탑 그리드
    const grid = document.createElement('div');
    grid.className = 'week-grid';
    days.forEach(day => grid.appendChild(buildCard(day, byDate[toYMD(day)] || [])));
    main.innerHTML = '';
    main.appendChild(grid);

    // 모바일 캐러셀
    buildCarousel(days, byDate);
  }

  // ── CONTROLS ──────────────────────────────────────
  document.getElementById('prev-btn').addEventListener('click', () => {
    baseMonday.setDate(baseMonday.getDate()-7); loadWeek();
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    baseMonday.setDate(baseMonday.getDate()+7); loadWeek();
  });
  document.getElementById('today-btn').addEventListener('click', () => {
    baseMonday = getMonday(new Date()); loadWeek();
  });

  // ── INIT ──────────────────────────────────────────
  updateTodayDisplay();
  loadOverrides().then(loadWeek);
</script>
</body>
</html>
